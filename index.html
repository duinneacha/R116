<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>R116 deliveries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@420;620&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --ink: #1c2430;
      --paper: #f3f5f4;
      --line: #d5dbd8;
      --path: #123a73;
      --here: #0b6b4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      background: var(--paper);
      color: var(--ink);
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: var(--paper);
    }
    header {
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    footer {
      flex-wrap: wrap;
      border-top: 1px solid var(--line);
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }
    #status { flex: 1 1 140px; text-align: center; }
    h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 620;
    }
    .summary { text-align: right; }
    #left, #clock {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 620;
    }
    #clock {
      font-size: 0.95rem;
      font-weight: 420;
      color: #4e5a56;
    }
    #status { margin: 0; color: #4e5a56; }
    button {
      appearance: none;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      font: 620 1rem/1 "Source Sans 3", sans-serif;
      padding: 12px 14px;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--path); outline-offset: 2px; }
    button.quiet {
      border-color: transparent;
      background: transparent;
      color: #4e5a56;
      padding: 12px 8px;
    }
    button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }
    #map { height: 100%; background: #e4e8e6; }
    .num {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--ink);
      font: 620 13px/1 "Source Sans 3", sans-serif;
      padding: 2px 3px;
      white-space: nowrap;
    }
    .num.called {
      background: #e6ebe8;
      color: #8b968f;
      border-color: #c5cdc8;
    }
    .num.target {
      background: #c45c12;
      color: #fff;
      border-color: #8a3c08;
    }
    .here {
      width: 18px;
      height: 18px;
      margin-left: -9px;
      margin-top: -9px;
      border-radius: 50%;
      background: var(--here);
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px rgba(11, 107, 74, 0.45);
    }
    .leaflet-tooltip { padding: 2px 6px; font-family: "Source Sans 3", sans-serif; }
    #progress-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      max-height: min(72dvh, 560px);
      overflow: auto;
      background: #fff;
      border-top: 1px solid var(--ink);
      padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 28px rgba(28, 36, 48, 0.16);
    }
    #progress-sheet h2 {
      margin: 0 0 10px;
      font-size: 1.25rem;
    }
    #progress-sheet .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .week-name {
      margin: 14px 0 0;
      font-weight: 620;
    }
    .day {
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .day strong { display: block; }
    .day p, .empty-note {
      margin: 2px 0 0;
      color: #4e5a56;
    }
  </style>
</head>
<body>
  <header>
    <h1>R116</h1>
    <button type="button" id="progress">Progress</button>
    <div class="summary">
      <p id="left">Douglas</p>
      <p id="clock" hidden></p>
    </div>
  </header>
  <div id="map"></div>
  <section id="progress-sheet" hidden>
    <div class="top-row">
      <h2>Progress</h2>
      <button type="button" id="progress-close">Close</button>
    </div>
    <div id="progress-body"></div>
  </section>
  <footer>
    <button type="button" id="where">Where I am</button>
    <button type="button" id="trace-back" aria-pressed="false">Trace back</button>
    <p id="status">Finding you</p>
    <button type="button" class="quiet" id="clear">Clear this round</button>
  </footer>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="houses.js?v=4"></script>
  <script>
    window.addEventListener("error", (event) => {
      const el = document.getElementById("status");
      if (el) el.textContent = event.message;
    });
    const TRACE_KEY = "r116-trace";
    const CALLED_KEY = "r116-called";
    const HISTORY_KEY = "r116-days";
    const ROUND_KEY = "r116-round";
    const LEGACY_FLAG = "r116-legacy-filed";
    const BREAK_MS = 8 * 60 * 1000;
    const houses = (window.HOUSES && window.HOUSES.houses) || [];

    const map = L.map("map", { zoomControl: false });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const leftEl = document.getElementById("left");
    const statusEl = document.getElementById("status");
    const whereBtn = document.getElementById("where");
    const traceBtn = document.getElementById("trace-back");
    const clearBtn = document.getElementById("clear");

    function houseId(house) {
      return house.n + "|" + house.lat.toFixed(5) + "|" + house.lon.toFixed(5);
    }

    function readJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (err) {
        return fallback;
      }
    }

    const called = new Set(readJson(CALLED_KEY, []));
    let tracePts = readJson(TRACE_KEY, []);
    let days = readJson(HISTORY_KEY, []);
    let round = readJson(ROUND_KEY, null);
    let filedNote = "";
    let follow = false;
    let jumpOnNext = false;
    let watchId = null;
    let hereMarker = null;
    let hereCircle = null;
    let clearArmed = false;
    let picking = false;
    let backHouse = null;

    const trace = L.polyline(tracePts, {
      color: "#123a73",
      weight: 5,
      opacity: 0.9
    }).addTo(map);

    function saveDays() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(days));
    }

    function saveRound() {
      if (round) localStorage.setItem(ROUND_KEY, JSON.stringify(round));
      else localStorage.removeItem(ROUND_KEY);
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function dateOf(ms) {
      const dt = new Date(ms);
      return dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
    }

    function labelDate(iso) {
      const parts = iso.split("-").map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return dt.toLocaleDateString("en-IE", { weekday: "short", day: "numeric", month: "short" });
    }

    function weekStart(iso) {
      const parts = iso.split("-").map(Number);
      const dt = new Date(parts[0], parts[1] - 1, parts[2]);
      const mondayOffset = (dt.getDay() + 6) % 7;
      dt.setDate(dt.getDate() - mondayOffset);
      return dateOf(dt.getTime());
    }

    function pathMetres(pts) {
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        const gap = metres(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
        if (gap < 2000) total += gap;
      }
      return total;
    }

    function roundDuration(now) {
      if (!round || !round.startedAt) return 0;
      const marks = [round.startedAt];
      tracePts.forEach((point) => {
        if (point[2]) marks.push(point[2]);
      });
      marks.sort((a, b) => a - b);
      const last = marks[marks.length - 1];
      if (document.visibilityState !== "hidden" || now - last < 30000) marks.push(now);
      let total = 0;
      for (let i = 1; i < marks.length; i++) {
        const gap = marks[i] - marks[i - 1];
        if (gap <= 0) continue;
        if (gap <= BREAK_MS) total += gap;
        else if (i === marks.length - 1) total += BREAK_MS;
      }
      return total;
    }

    function formatDuration(ms) {
      if (ms == null) return "Time not recorded";
      const mins = Math.max(0, Math.round(ms / 60000));
      const hours = Math.floor(mins / 60);
      const rest = mins % 60;
      if (hours <= 0) return mins + " min";
      return hours + "h " + pad(rest) + "m";
    }

    function formatDistance(metresOut) {
      if (metresOut < 1000) return Math.round(metresOut) + " m";
      return (metresOut / 1000).toFixed(1) + " km";
    }

    function formatPace(ms, count) {
      if (ms == null || !count) return "";
      const secs = Math.round(ms / count / 1000);
      if (secs < 90) return "about " + secs + "s each";
      const mins = secs / 60;
      return "about " + mins.toFixed(1) + " min each";
    }

    function statLine(day) {
      const bits = [formatDuration(day.durationMs), formatDistance(day.distanceM), day.called + " houses"];
      const pace = formatPace(day.durationMs, day.called);
      if (pace) bits.push(pace);
      return bits.join(" · ");
    }

    function ensureRound() {
      if (round && round.startedAt) return;
      round = { startedAt: Date.now() };
      saveRound();
      showClock();
    }

    function showClock() {
      const clock = document.getElementById("clock");
      if (round && round.startedAt) {
        clock.hidden = false;
        clock.textContent = formatDuration(roundDuration(Date.now()));
        return;
      }
      if (filedNote) {
        clock.hidden = false;
        clock.textContent = filedNote;
        return;
      }
      clock.hidden = true;
      clock.textContent = "";
    }

    function liveDay() {
      if (!round || !round.startedAt) return null;
      if (called.size === 0 && pathMetres(tracePts) < 80) return null;
      return {
        date: dateOf(round.startedAt),
        durationMs: roundDuration(Date.now()),
        called: called.size,
        total: houses.length,
        distanceM: Math.round(pathMetres(tracePts)),
        live: true
      };
    }

    function sumDays(list) {
      return list.reduce((sum, day) => {
        sum.called += day.called || 0;
        sum.distanceM += day.distanceM || 0;
        if (day.durationMs == null) sum.missingTime = true;
        else sum.durationMs += day.durationMs;
        return sum;
      }, { called: 0, distanceM: 0, durationMs: 0, missingTime: false });
    }

    function renderProgress() {
      const body = document.getElementById("progress-body");
      const current = liveDay();
      const finished = days.slice().sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0) || b.date.localeCompare(a.date));
      if (!current && !finished.length) {
        body.innerHTML = '<p class="empty-note">Nothing saved yet. The clock starts when you move off. Clear this round when you finish, and the day is kept.</p>';
        return;
      }
      const blocks = [];
      if (current) {
        blocks.push('<p class="week-name">This round</p><div class="day"><strong>' + labelDate(current.date) + ', in progress</strong><p>' + statLine(current) + '</p></div>');
      }
      const thisWeek = weekStart(dateOf(Date.now()));
      const lastWeekDate = new Date();
      lastWeekDate.setDate(lastWeekDate.getDate() - 7);
      const lastWeek = weekStart(dateOf(lastWeekDate.getTime()));
      [{ key: thisWeek, title: "This week" }, { key: lastWeek, title: "Last week" }].forEach((week) => {
        const rows = finished.filter((day) => weekStart(day.date) === week.key);
        const extra = current && weekStart(current.date) === week.key ? [current] : [];
        const all = rows.concat(extra);
        if (!all.length) return;
        const sum = sumDays(all);
        const summary = statLine({
          durationMs: sum.missingTime && sum.durationMs === 0 ? null : sum.durationMs,
          distanceM: sum.distanceM,
          called: sum.missingTime ? 0 : sum.called
        }).replace(/ · 0 houses$/, " · " + sum.called + " houses");
        const lines = rows.map((day) => '<div class="day"><strong>' + labelDate(day.date) + '</strong><p>' + statLine(day) + '</p></div>').join("");
        blocks.push('<p class="week-name">' + week.title + '</p><div class="day"><strong>Total</strong><p>' + summary + '</p></div>' + lines);
      });
      const older = finished.filter((day) => {
        const key = weekStart(day.date);
        return key !== thisWeek && key !== lastWeek;
      });
      if (older.length) {
        blocks.push('<p class="week-name">Earlier</p>' + older.map((day) => '<div class="day"><strong>' + labelDate(day.date) + '</strong><p>' + statLine(day) + '</p></div>').join(""));
      }
      body.innerHTML = blocks.join("");
    }

    function fileLegacyRound() {
      if (localStorage.getItem(LEGACY_FLAG)) return;
      const distance = pathMetres(tracePts);
      if (called.size === 0 && distance < 80) {
        localStorage.setItem(LEGACY_FLAG, "1");
        return;
      }
      days.push({
        date: "2026-10-06",
        startedAt: null,
        finishedAt: Date.parse("2026-10-06T18:00:00"),
        durationMs: null,
        called: called.size,
        total: houses.filter((house) => house.street !== "Newlyn Vale").length,
        distanceM: Math.round(distance),
        legacy: true
      });
      saveDays();
      called.clear();
      tracePts = [];
      trace.setLatLngs([]);
      saveCalled();
      saveTrace();
      localStorage.setItem(LEGACY_FLAG, "1");
      filedNote = "Tue 6 Oct saved. Time was not recorded.";
    }

    fileLegacyRound();
    const backLine = L.polyline([], {
      color: "#c45c12",
      weight: 6,
      opacity: 0.95
    }).addTo(map);

    function metres(aLat, aLon, bLat, bLon) {
      const x = (aLon - bLon) * Math.cos(aLat * Math.PI / 180) * 111320;
      const y = (aLat - bLat) * 111320;
      return Math.hypot(x, y);
    }

    function saveCalled() {
      localStorage.setItem(CALLED_KEY, JSON.stringify([...called]));
    }

    function saveTrace() {
      localStorage.setItem(TRACE_KEY, JSON.stringify(tracePts));
    }

    function stillToCall() {
      return houses.filter((house) => !called.has(houseId(house))).length;
    }

    function showLeft() {
      const left = stillToCall();
      leftEl.textContent = houses.length
        ? left + " still to call"
        : "No houses yet";
    }

    function paint(house) {
      if (!house.el) return;
      house.el.classList.toggle("called", called.has(houseId(house)) && house !== backHouse);
      house.el.classList.toggle("target", house === backHouse);
    }

    function stopTracing() {
      picking = false;
      backHouse = null;
      backLine.setLatLngs([]);
      traceBtn.setAttribute("aria-pressed", "false");
      traceBtn.textContent = "Trace back";
      houses.forEach(paint);
    }

    const bounds = houses.map((house) => [house.lat, house.lon]);
    if (bounds.length) map.fitBounds(bounds, { padding: [28, 28] });
    else map.setView([51.8782, -8.4192], 17);

    houses.forEach((house) => {
      const icon = L.divIcon({
        className: "",
        html: `<span class="num">${house.n}</span>`
      });
      const marker = L.marker([house.lat, house.lon], {
        icon,
        title: house.n + " " + house.street,
        zIndexOffset: called.has(houseId(house)) ? 0 : 400
      }).addTo(map);
      house.el = marker.getElement().querySelector(".num");
      paint(house);
      marker.bindTooltip(house.n + " " + house.street, { direction: "top", offset: [0, -8] });
      marker.on("click", () => {
        if (picking) {
          goBackTo(house);
          return;
        }
        const id = houseId(house);
        if (called.has(id)) called.delete(id);
        else {
          called.add(id);
          ensureRound();
        }
        paint(house);
        saveCalled();
        showLeft();
      });
    });

    showLeft();

    function showHere(lat, lon, accuracy) {
      const latlng = [lat, lon];
      const radius = Math.max(accuracy || 12, 8);
      if (!hereMarker) {
        hereCircle = L.circle(latlng, {
          radius,
          color: "#0b6b4a",
          weight: 1,
          fillColor: "#0b6b4a",
          fillOpacity: 0.12,
          interactive: false
        }).addTo(map);
        hereMarker = L.marker(latlng, {
          icon: L.divIcon({ className: "", html: '<div class="here"></div>', iconSize: [18, 18] }),
          zIndexOffset: 1000,
          interactive: false,
          keyboard: false
        }).addTo(map);
      } else {
        hereMarker.setLatLng(latlng);
        hereCircle.setLatLng(latlng);
        hereCircle.setRadius(radius);
      }
    }

    function markPassed(lat, lon, accuracy) {
      if (accuracy > 25) return;
      let changed = false;
      houses.forEach((house) => {
        const id = houseId(house);
        if (called.has(id)) return;
        if (metres(lat, lon, house.lat, house.lon) <= 18) {
          called.add(id);
          paint(house);
          changed = true;
        }
      });
      if (changed) {
        ensureRound();
        saveCalled();
        showLeft();
      }
    }

    function addTrace(lat, lon, accuracy) {
      if (accuracy > 35) return;
      const last = tracePts[tracePts.length - 1];
      if (last && metres(lat, lon, last[0], last[1]) < 4) return;
      ensureRound();
      tracePts.push([lat, lon, Date.now()]);
      trace.setLatLngs(tracePts);
      saveTrace();
    }

    function onPosition(pos) {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = pos.coords.accuracy || 0;
      showHere(lat, lon, accuracy);
      addTrace(lat, lon, accuracy);
      markPassed(lat, lon, accuracy);
      if (jumpOnNext) {
        map.setView([lat, lon], Math.max(map.getZoom(), 18));
        jumpOnNext = false;
      } else if (follow) {
        map.panTo([lat, lon]);
      }
      if (!picking && !backHouse) {
        statusEl.textContent = accuracy > 30
          ? "Location is rough"
          : "You are here";
      }
    }

    function onLocateError(err) {
      statusEl.textContent = err && err.code === 1
        ? "Allow location to see where you are"
        : "Location is not available";
    }

    function startWatch(jump) {
      if (!navigator.geolocation) {
        statusEl.textContent = "This phone has no location";
        return;
      }
      if (jump) {
        follow = true;
        jumpOnNext = true;
        if (hereMarker) {
          map.setView(hereMarker.getLatLng(), Math.max(map.getZoom(), 18));
          jumpOnNext = false;
        }
      }
      if (watchId != null) return;
      statusEl.textContent = "Finding you";
      watchId = navigator.geolocation.watchPosition(onPosition, onLocateError, {
        enableHighAccuracy: true,
        maximumAge: 2000,
        timeout: 20000
      });
    }

    map.on("dragstart", () => {
      follow = false;
      if (hereMarker) statusEl.textContent = "Looking around";
    });

    async function goBackTo(house) {
      if (!hereMarker) {
        statusEl.textContent = "Still finding you";
        startWatch(false);
        return;
      }
      picking = false;
      backHouse = house;
      houses.forEach(paint);
      traceBtn.setAttribute("aria-pressed", "false");
      traceBtn.textContent = "Stop tracing";
      follow = false;
      const here = hereMarker.getLatLng();
      statusEl.textContent = "Tracing back to " + house.n;
      const url = "https://router.project-osrm.org/route/v1/foot/"
        + here.lng + "," + here.lat + ";" + house.lon + "," + house.lat
        + "?overview=full&geometries=geojson";
      let line = [[here.lat, here.lng], [house.lat, house.lon]];
      let label = "Straight line back to " + house.n + " " + house.street;
      try {
        const response = await fetch(url);
        const data = await response.json();
        const route = data.routes && data.routes[0];
        if (route && route.geometry) {
          line = route.geometry.coordinates.map((pair) => [pair[1], pair[0]]);
          const minutes = Math.max(1, Math.round(route.duration / 60));
          label = "Back to " + house.n + " " + house.street + ", about " + minutes + " min";
        }
      } catch (err) {
        label = "Straight line back to " + house.n + " " + house.street;
      }
      if (backHouse !== house) return;
      backLine.setLatLngs(line);
      map.fitBounds(backLine.getBounds(), { padding: [36, 36] });
      statusEl.textContent = label;
    }

    whereBtn.addEventListener("click", () => startWatch(true));

    traceBtn.addEventListener("click", () => {
      if (backHouse) {
        stopTracing();
        statusEl.textContent = hereMarker ? "You are here" : "Finding you";
        return;
      }
      picking = !picking;
      traceBtn.setAttribute("aria-pressed", picking ? "true" : "false");
      traceBtn.textContent = picking ? "Tap a house" : "Trace back";
      statusEl.textContent = picking
        ? "Tap the house to go back to"
        : (hereMarker ? "You are here" : "Finding you");
    });

    clearBtn.addEventListener("click", () => {
      if (!clearArmed) {
        clearArmed = true;
        clearBtn.textContent = "Tap again to clear";
        setTimeout(() => {
          clearArmed = false;
          clearBtn.textContent = "Clear this round";
        }, 2500);
        return;
      }
      clearArmed = false;
      clearBtn.textContent = "Clear this round";
      const distance = pathMetres(tracePts);
      const worthSaving = called.size > 0 || distance >= 80;
      if (worthSaving) {
        const when = round && round.startedAt ? round.startedAt : Date.now();
        days.push({
          date: dateOf(when),
          startedAt: round && round.startedAt || null,
          finishedAt: Date.now(),
          durationMs: round && round.startedAt ? roundDuration(Date.now()) : null,
          called: called.size,
          total: houses.length,
          distanceM: Math.round(distance),
          legacy: false
        });
        saveDays();
        statusEl.textContent = "Round saved";
      }
      tracePts = [];
      trace.setLatLngs([]);
      stopTracing();
      called.clear();
      round = null;
      filedNote = "";
      houses.forEach(paint);
      saveTrace();
      saveCalled();
      saveRound();
      showLeft();
      showClock();
    });

    const progressBtn = document.getElementById("progress");
    const progressSheet = document.getElementById("progress-sheet");
    function setProgress(open) {
      progressSheet.hidden = !open;
      progressBtn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) renderProgress();
    }
    progressBtn.addEventListener("click", () => setProgress(progressSheet.hidden));
    document.getElementById("progress-close").addEventListener("click", () => setProgress(false));
    showClock();
    setInterval(showClock, 15000);

    if (navigator.geolocation) startWatch(false);
  </script>
</body>
</html>
